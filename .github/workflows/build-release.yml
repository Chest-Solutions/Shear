name: build-release

# Every pushed commit produces a GitHub release. Windows gets a
# double-clickable shear.exe (editor baked in). Other platforms get a
# matching binary plus a zip.
on:
  push:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
          rm -rf ../ui
          cp -r dist ../ui

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="shear"
          ldflags="-s -w"
          if [ "$GOOS" = "windows" ]; then
            out="shear.exe"
            ldflags="-s -w -H windowsgui"
          fi
          mkdir -p bin release-files
          go build -trimpath -ldflags="$ldflags" -o "bin/$out" .
          if [ "$GOOS" = "windows" ]; then
            cp "bin/shear.exe" "release-files/shear.exe"
            cp "bin/shear.exe" "release-files/shear-windows-${GOARCH}.exe"
          else
            cp "bin/$out" "release-files/shear-${GOOS}-${GOARCH}"
          fi
          (cd bin && zip -qr "../release-files/shear-${GOOS}-${GOARCH}.zip" "$out")

      - uses: actions/upload-artifact@v4
        with:
          name: shear-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-files/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse --short HEAD)"
          subject="$(git log -1 --pretty=%s)"
          author="$(git log -1 --pretty=%an)"
          mkdir -p upload
          # Flatten artifacts. Prefer the Windows exe at the top of the list.
          find artifacts -type f -print0 | while IFS= read -r -d '' f; do
            cp "$f" "upload/$(basename "$f")"
          done
          files=$(ls -1 upload/*)
          gh release create "run-${{ github.run_number }}" \
            --title "Shear $sha · $subject" \
            --notes "Commit $sha by $author on \`${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}\`

          **Windows:** download \`shear.exe\` and double-click. The editor is baked in (Microsoft Edge WebView2).

          **macOS / Linux:** download the binary for your arch, \`chmod +x\`, run it.

          The app listens on \`0.0.0.0:8080\` so port-forwarding works.

          | Asset |
          | --- |
          | \`shear.exe\` · windows-amd64 |
          | linux-amd64 · linux-arm64 · darwin-amd64 · darwin-arm64 |" \
            $files
