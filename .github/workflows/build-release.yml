name: build-release

# Every pushed commit produces a new GitHub release containing the app:
# the Go web server binary (serves the editor + API) plus the built
# frontend (web/dist), zipped per platform.
on:
  # Branch pushes only — tag pushes (release tagging) must not re-run CI.
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet & test
        run: |
          set -o pipefail
          { echo "=== go vet ==="; go vet ./... 2>&1; echo; echo "=== go test ==="; go test ./... 2>&1; } | tee /tmp/gotest.log

      # Pushes made with GITHUB_TOKEN never trigger new runs, so this
      # cannot loop — it just makes the log inspectable from git.
      - name: Publish test report
        if: always()
        run: |
          mkdir -p ci-reports
          cp /tmp/gotest.log "ci-reports/unit-$(git rev-parse --short HEAD).log"
          git config user.name "shear-ci"
          git config user.email "ci@shear.local"
          git add ci-reports
          if ! git diff --cached --quiet; then
            git commit -m "ci: unit test report $(git rev-parse --short HEAD)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build server
        run: CGO_ENABLED=0 go build -o /tmp/shear .

      - name: Run server + two-peer collaboration scenario
        run: |
          set -o pipefail
          SHEAR_ADDR=127.0.0.1:8090 SHEAR_DATA=/tmp/shear-data SHEAR_DIST="$PWD/web/dist" /tmp/shear &
          srv=$!
          for i in $(seq 1 50); do
            curl -sf http://127.0.0.1:8090/api/health >/dev/null && break
            sleep 0.2
          done
          SHEAR_BASE=http://127.0.0.1:8090 node scripts/e2e-collab.mjs | tee /tmp/e2e.log
          status=$?
          kill $srv 2>/dev/null || true
          exit $status

      - name: Publish e2e report
        if: always()
        run: |
          mkdir -p ci-reports
          cp /tmp/e2e.log "ci-reports/e2e-$(git rev-parse --short HEAD).log" || true
          git config user.name "shear-ci"
          git config user.email "ci@shear.local"
          git add ci-reports
          if ! git diff --cached --quiet; then
            git commit -m "ci: e2e report $(git rev-parse --short HEAD)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # One-shot courier: binaries built & verified in the Arena session are
  # staged under release-stage/ (this sandbox cannot reach
  # uploads.github.com, the runner can). Publishes them as a named release,
  # then unstages so the blobs leave the branch on the next commit.
  publish-staged:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish staged binaries to a named release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls release-stage/*.zip >/dev/null 2>&1 || { echo "nothing staged"; exit 0; }
          tag="$(cat release-stage/RELEASE_TAG 2>/dev/null || echo v2.0.0)"
          title="$(cat release-stage/RELEASE_TITLE 2>/dev/null || echo "Shear 2.0")"
          sha="$(git rev-parse --short HEAD)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-stage/*.zip --clobber
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "Binaries built in the Arena session with a from-scratch Go 1.23.0 toolchain and verified there by the full two-peer collaboration e2e; published through CI.

          Run \`./shear\` (or \`shear.exe\`) — serves the editor + API on :8080.

          | Platform |
          | --- |
          | linux-amd64 · linux-arm64 · darwin-amd64 · darwin-arm64 · windows-amd64 |

          Each zip contains the \`shear\` server binary and \`web/dist\` (the editor). The desktop webview shell (\`go build -tags webview\`) is built locally — it needs the system webview libraries.

          Commit: \`$sha\`" \
            release-stage/*.zip

          git config user.name "shear-ci"
          git config user.email "ci@shear.local"
          git rm -r -q release-stage
          git commit -m "ci: publish $tag assets, unstage binaries"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="shear"
          [ "$GOOS" = "windows" ] && out="shear.exe"
          go build -trimpath -ldflags="-s -w" -o "bin/$out" .

      - name: Package
        run: |
          out="bin/shear"
          [ "${{ matrix.goos }}" = "windows" ] && out="bin/shear.exe"
          mkdir -p pkg/web
          cp "$out" pkg/
          cp -r web/dist pkg/web/dist
          (cd pkg && zip -qr "../shear-${{ matrix.goos }}-${{ matrix.goarch }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: shear-${{ matrix.goos }}-${{ matrix.goarch }}
          path: shear-${{ matrix.goos }}-${{ matrix.goarch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse --short HEAD)"
          subject="$(git log -1 --pretty=%s)"
          author="$(git log -1 --pretty=%an)"
          files=""
          for f in artifacts/*/*; do files="$files $f"; done
          gh release create "run-${{ github.run_number }}" \
            --title "Shear $sha · $subject" \
            --notes "Commit $sha by $author on \`${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}\`

          Run: \`./shear\` (or \`shear.exe\`) — serves the editor + API on :8080.

          | Platform |
          | --- |
          | linux-amd64 · linux-arm64 · darwin-amd64 · darwin-arm64 · windows-amd64 |

          Each zip contains the \`shear\` server and \`web/dist\` (the editor). The desktop webview shell (go build -tags webview) is built locally — it needs the system webview libraries." \
            $files
